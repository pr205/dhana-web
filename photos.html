<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DHANA PHOTOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 20px;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;

            background:
                radial-gradient(circle at top left, #173b72, transparent 40%),
                radial-gradient(circle at bottom right, #3b075c, transparent 45%),
                #050816;
        }

        h1 {
            color: #00eaff;
            font-size: 42px;
            letter-spacing: 4px;
            text-shadow:
                0 0 8px #00eaff,
                0 0 20px #006eff;
        }

        h2 {
            color: #ff00d4;
            text-shadow: 0 0 12px #ff00d4;
        }

        input[type="file"] {
            margin: 20px 5px;
            padding: 12px;
            max-width: 100%;
            border: 2px solid #00eaff;
            border-radius: 10px;
            background: #101936;
            color: white;
            box-shadow: 0 0 12px #00eaff;
        }

        button {
            padding: 13px 24px;
            border: 2px solid #ff00d4;
            border-radius: 10px;
            background: #180d35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px #ff00d4;
        }

        button:hover {
            background: #ff00d4;
            color: #050816;
        }

        #message {
            margin: 20px;
            color: #00ff99;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff99;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 22px;
            margin-top: 35px;
        }

        #gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border: 2px solid #00eaff;
            border-radius: 15px;
            box-shadow:
                0 0 10px #00eaff,
                0 0 25px #073cff;
        }

        a {
            display: inline-block;
            margin-top: 35px;
            color: #00eaff;
            font-weight: bold;
            text-decoration: none;
            text-shadow: 0 0 10px #00eaff;
        }

        a:hover {
            color: #ff00d4;
        }
    </style>
</head>

<body>

    <h1>DHANA PHOTOS</h1>

    <h2>Upload Your Photos</h2>

    <input type="file" id="fileInput" accept="image/*">

    <br>

    <button id="uploadBtn">Upload Photo</button>

    <p id="message"></p>

    <div id="gallery"></div>

    <a href="index.html">Back to Home</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = "https://mzexilwgrncubwyhehhj.supabase.co";

        const supabaseKey =
            "sb_publishable_Tn3UJ55T4HS-4GwSVrFljg_u7KqwVh2";

        const supabaseClient =
            supabase.createClient(supabaseUrl, supabaseKey);

        const fileInput = document.getElementById("fileInput");
        const uploadBtn = document.getElementById("uploadBtn");
        const message = document.getElementById("message");
        const gallery = document.getElementById("gallery");

        uploadBtn.addEventListener("click", async () => {
            const file = fileInput.files[0];

            if (!file) {
                message.textContent = "Please select a photo first.";
                return;
            }

            const fileName =
                Date.now() + "-" + file.name;

            message.textContent = "Uploading...";

            const { error } = await supabaseClient
                .storage
                .from("photos")
                .upload(fileName, file);

            if (error) {
                message.textContent =
                    "Upload failed: " + error.message;
                return;
            }

            message.textContent = "Photo uploaded successfully!";

            fileInput.value = "";

            loadPhotos();
        });

        async function loadPhotos() {
            gallery.innerHTML = "";

            const { data, error } = await supabaseClient
                .storage
                .from("photos")
                .list();

            if (error) {
                message.textContent =
                    "Cannot load photos: " + error.message;
                return;
            }

            data.forEach(file => {
              data.forEach(file => {
    const { data: publicUrlData } =
        supabaseClient
            .storage
            .from("photos")
            .getPublicUrl(file.name);

    const box = document.createElement("div");

    const img = document.createElement("img");
    img.src = publicUrlData.publicUrl;
    img.alt = "Uploaded photo";

   
            loadPhotos(); const download = document.createElement("a");
    download.href = publicUrlData.publicUrl;
    download.download = file.name;
    download.textContent = "Download";
    download.style.margin = "10px";

    const del = document.createElement("button");
    del.textContent = "Delete";

    del.onclick = async () => {
        const confirmDelete = confirm("Delete this photo?");

        if (!confirmDelete) return;

        const { error } = await supabaseClient
            .storage
            .from("photos")
            .remove([file.name]);

        if (error) {
            message.textContent = "Delete failed: " + error.message;
        } else {
            message.textContent = "Photo deleted!";
        }
    };

    box.appendChild(img);
    box.appendChild(document.createElement("br"));
    box.appendChild(download);
    box.appendChild(del);

    gallery.appendChild(box);
});
            });
        }

        loadPhotos();
    </script>

</body>

</html>
