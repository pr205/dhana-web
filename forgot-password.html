<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - DHANA PHOTOS</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050816;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: #0b1025;
      border: 1px solid #00d9ff;
      border-radius: 15px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      color: #00d9ff;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #333b5c;
      background: #050816;
      color: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #00d9ff;
      font-weight: bold;
      cursor: pointer;
    }

    p {
      text-align: center;
    }

    a {
      color: #00d9ff;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>DHANA PHOTOS</h1>
    <h2>Reset Password</h2>

    <input type="email" id="email" placeholder="Enter your Gmail" required>

    <button onclick="resetPassword()">Send Reset Email</button>

    <p id="message"></p>

    <p>
      <a href="login.html">Back to Login</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUNIpAlkbhi-AEnmy-CGxQLRdp1tvDkpQ",
      authDomain: "dhana-photos.firebaseapp.com",
      projectId: "dhana-photos",
      storageBucket: "dhana-photos.firebasestorage.app",
      messagingSenderId: "785350883394",
      appId: "1:785350883394:web:dab26e07df8bfb797015db"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.resetPassword = async function () {
      const email = document.getElementById("email").value;
      const message = document.getElementById("message");

      try {
        await sendPasswordResetEmail(auth, email);
        message.textContent = "Password reset email sent. Check your Gmail.";
      } catch (error) {
        message.textContent = "Please enter a registered Gmail address.";
      }
    };
  </script>
</body>
</html>
